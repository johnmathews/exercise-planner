name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm 10.9 (bundled with Node 22) crashes resolving this tree; see docs/development.md.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build-only

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Runs the shared fixtures in ../fixtures/transfer/ too; fails under the floor in pyproject.toml.
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          # Pinned and hashed, so pip-audit needs no pip of its own to resolve them.
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
