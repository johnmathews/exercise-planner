# Hashed build assets never change; everything else (index.html, favicon) revalidates so a
# deploy takes effect on the next load. One server-level add_header set: nginx drops inherited
# add_header directives in any location that declares its own.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store";
    default     "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' styles: Vue binds the accent and swatch colours as inline styles.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /assets/ {
        try_files $uri =404;
    }

    # The API container (docs/api.md). A variable upstream with Docker's resolver means nginx
    # starts, and keeps serving the app, while the API is down; /api/ then answers 502, which
    # the client treats as offline. The API sets Cache-Control too; hiding it leaves the
    # server-level header as the only one.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://fitness-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
